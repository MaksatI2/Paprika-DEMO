# Public routes of the Acme Shop API gateway and their per-route limits.
routes:
  - path: /api/checkout
    upstream: checkout
    timeout_ms: 3000
    rate_limit_rps: 150
  - path: /api/orders/{id}
    upstream: orders
    timeout_ms: 2000
    rate_limit_rps: 200
  - path: /api/search
    upstream: search
    timeout_ms: 1500
    rate_limit_rps: 300
  - path: /api/login
    upstream: authentication
    timeout_ms: 2000
    rate_limit_rps: 50
